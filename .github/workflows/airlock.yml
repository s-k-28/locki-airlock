name: AIRLOCK software checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: airlock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            spacetime/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned JavaScript dependencies
        run: |
          npm ci --prefix frontend --no-fund
          npm ci --prefix spacetime --no-fund
      - name: Module types, policy invariants and transactional tests
        run: |
          npm run check --prefix spacetime
          npm test --prefix spacetime
      - name: Dashboard production build and dependency audit
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend --audit-level=low
          npm audit --prefix spacetime --audit-level=low
      - name: Install pinned Python environment
        run: |
          python -m pip install uv
          uv sync --project backend --frozen
      - name: Adapter and protected callback tests without OS actions
        run: |
          node frontend/node_modules/tsx/dist/cli.mjs --test scripts/airlock_mac_bridge.test.ts scripts/airlock_nemotron_tools.test.ts scripts/tests/airlock_voice_bridge.test.ts scripts/tests/airlock_lock_adapter.test.ts scripts/airlock_sandbox.test.ts scripts/airlock_publisher.test.ts scripts/airlock_publish_stream.test.ts
      - name: Read-only Mac parsing and voice policy tests
        env:
          PYTHONPATH: backend
        run: |
          backend/.venv/bin/python -m pytest -q backend/tests/test_airlock_*.py
          backend/.venv/bin/python -m unittest discover -s scripts -p 'airlock_nemotron_test.py'
          backend/.venv/bin/python -m unittest discover -s edge/jetson/tests

# Physical camera, USB insertion, local audio, model inference and actual screen
# locking are separate opt-in acceptance trials; CI does not fabricate them.
